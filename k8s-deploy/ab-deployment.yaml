apiVersion: apps/v1
kind: Deployment
metadata:
  name: fitness-app-a
  namespace: fitness
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fitness-app
      version: a
  template:
    metadata:
      labels:
        app: fitness-app
        version: a
    spec:
      containers:
      - name: fitness-app
        image: chetanmatadmtech/fitness-app:v1
        ports:
        - containerPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fitness-app-b
  namespace: fitness
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fitness-app
      version: b
  template:
    metadata:
      labels:
        app: fitness-app
        version: b
    spec:
      containers:
      - name: fitness-app
        image: chetanmatadmtech/fitness-app:v2
        ports:
        - containerPort: 8080

