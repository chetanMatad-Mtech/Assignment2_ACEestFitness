apiVersion: apps/v1
kind: Deployment
metadata:
  name: fitness-app-shadow
  namespace: fitness
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fitness-app
      version: shadow
  template:
    metadata:
      labels:
        app: fitness-app
        version: shadow
    spec:
      containers:
      - name: fitness-app
        image: chetanmatadmtech/fitness-app:v2
        imagePullPolicy: Never
        ports:
        - containerPort: 8080

