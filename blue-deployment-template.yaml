apiVersion: apps/v1
kind: Deployment
metadata:
  name: fitness-app-blue-VERSION_PLACEHOLDER   # dynamic per build
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fitness-app
      version: VERSION_PLACEHOLDER
  template:
    metadata:
      labels:
        app: fitness-app
        version: VERSION_PLACEHOLDER
    spec:
      containers:
      - name: fitness-app-container
        image: IMAGE_PLACEHOLDER
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20

