apiVersion: apps/v1
kind: Deployment
metadata:
  name: fitness-app-green
  labels:
    app: fitness-app
    version: green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fitness-app
      version: green
  template:
    metadata:
      labels:
        app: fitness-app
        version: green
    spec:
      containers:
        - name: fitness-app-container
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 8080
          env:
            - name: FLASK_APP
              value: "application.py"
            - name: FLASK_ENV
              value: "production"
---
apiVersion: v1
kind: Service
metadata:
  name: fitness-app-green-service
  labels:
    app: fitness-app
    version: green
spec:
  type: ClusterIP
  selector:
    app: fitness-app
    version: green
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080

