apiVersion: apps/v1
kind: Deployment
metadata:
  name: DEPLOYMENT_NAME_PLACEHOLDER
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fitness-app
      version: VERSION_PLACEHOLDER
  template:
    metadata:
      labels:
        app: fitness-app
        version: VERSION_PLACEHOLDER
    spec:
      containers:
      - name: fitness-app
        image: IMAGE_PLACEHOLDER
        ports:
        - containerPort: 5000
        # optional: resource limits for shadow pods

